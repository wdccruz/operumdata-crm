project_id = "operumdata-crm"
[auth]
site_url = "http://localhost:5173/operumdata-crm/"
additional_redirect_urls = ["http://localhost:5173/operumdata-crm/"]
enable_signup = false
minimum_password_length = 12
[functions.manage-users]
verify_jwt = true

# Autorização por segredo aleatório de uso único; nenhum acesso é concedido sem validá-lo.
[functions.activate-access]
verify_jwt = false

# Retorno do Google (OAuth) e agendamento chegam sem JWT: o estado é assinado (HMAC) e o
# agendamento usa a chave GOOGLE_SYNC_KEY. As demais ações validam a sessão dentro da função.
[functions.google-calendar]
verify_jwt = false
